name: Deploy to AWS Amplify

# Publishes as the site ROOT whichever was updated most recently: the newest dated release
# folder (e.g. nov182026-updated/) or the repo root files. See .github/scripts/pick-site-dir.sh.
#
# Triggers:
#  - push to main (normal path)
#  - every 10 minutes: redeploys only if the live site is behind main
#    (catches commits pushed with [skip ci], which suppresses the push trigger)
#  - manual: Actions tab -> Run workflow

on:
  push:
    branches: [main]
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: amplify-deploy
  cancel-in-progress: false

env:
  AWS_REGION: ap-southeast-1
  AMPLIFY_APP_ID: dp4asw0uk11mm
  AMPLIFY_BRANCH: main
  SITE_URL: https://main.dp4asw0uk11mm.amplifyapp.com

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history: pick-site-dir.sh compares last-change times

      - name: Check whether live site is already current
        id: check
        run: |
          LIVE=$(curl -fsS "$SITE_URL/deploy-version.txt?t=$(date +%s)" 2>/dev/null | head -1 || true)
          echo "live=$LIVE main=$GITHUB_SHA"
          if [[ "$GITHUB_EVENT_NAME" == "schedule" && "$LIVE" == "$GITHUB_SHA" ]]; then
            echo "Live site already at $GITHUB_SHA, nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Choose site folder
        if: steps.check.outputs.skip != 'true'
        id: pick
        run: |
          DIR=$(bash .github/scripts/pick-site-dir.sh)
          echo "Publishing '$DIR' as the site root"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - uses: aws-actions/configure-aws-credentials@v4
        if: steps.check.outputs.skip != 'true'
        with:
          role-to-assume: arn:aws:iam::164793262137:role/propellus-site-preview-amplify-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Package site
        if: steps.check.outputs.skip != 'true'
        env:
          DIR: ${{ steps.pick.outputs.dir }}
        run: |
          set -euo pipefail
          cd "$DIR"
          printf '%s\n%s\n' "$GITHUB_SHA" "$DIR" > deploy-version.txt
          zip -r -q /tmp/site.zip . -x '.git/*' '.github/*' 'AGENTS.md' '*-updated/*'
          python3 "$GITHUB_WORKSPACE/.github/scripts/finalize-production-zip.py" /tmp/site.zip
          unzip -l /tmp/site.zip | tail -1

      - name: Upload and deploy
        if: steps.check.outputs.skip != 'true'
        run: |
          set -euo pipefail
          test "$(aws sts get-caller-identity --query Account --output text)" = "164793262137"
          read -r JOB_ID URL < <(aws amplify create-deployment \
            --app-id "$AMPLIFY_APP_ID" --branch-name "$AMPLIFY_BRANCH" \
            --query '[jobId,zipUploadUrl]' --output text)
          curl -sSf -X PUT -H "Content-Type: application/zip" --upload-file /tmp/site.zip "$URL"
          aws amplify start-deployment --app-id "$AMPLIFY_APP_ID" --branch-name "$AMPLIFY_BRANCH" --job-id "$JOB_ID"
          for i in $(seq 1 60); do
            STATUS=$(aws amplify get-job --app-id "$AMPLIFY_APP_ID" --branch-name "$AMPLIFY_BRANCH" --job-id "$JOB_ID" --query job.summary.status --output text)
            echo "Job $JOB_ID: $STATUS"
            case "$STATUS" in
              SUCCEED) echo "Live: $SITE_URL"; exit 0;;
              FAILED|CANCELLED) exit 1;;
            esac
            sleep 5
          done
          exit 1
