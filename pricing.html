<!DOCTYPE html>
<html lang="en">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Plans &amp; Pricing — Propellus</title>
<link rel="icon" type="image/png" href="propellus-logo.png" />
<meta name="description" content="Book a demo to discuss pricing for your team." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />
<style>
  /* ---- pricing hero (branded, product mock) ---- */
  .pr-hero { position:relative; background:var(--bg-deep); overflow:hidden; min-height:76vh; display:flex; align-items:center; }
  .pr-hero-grid-bg { position:absolute; inset:0; background-image:linear-gradient(#FFFFFF 1px, transparent 1px), linear-gradient(90deg, #FFFFFF 1px, transparent 1px); background-size:46px 46px; mask-image:radial-gradient(120% 90% at 78% 10%, #000 30%, transparent 78%); }
  .pr-hero-glow { position:absolute; top:-160px; right:-120px; width:520px; height:520px; border-radius:50%; background:radial-gradient(circle, rgba(0,194,203,0.22), transparent 65%); pointer-events:none; }
  .pr-hero .container { position:relative; z-index:2; }
  .pr-hero-grid { display:grid; grid-template-columns:1.05fr 0.95fr; gap:56px; align-items:center; }
  .pr-hero-vis { display:flex; justify-content:center; }
  .pr-hero-card { width:100%; max-width:400px; background:#FFFFFF; border:1px solid var(--border); border-radius:18px; padding:24px; box-shadow:0 30px 70px rgba(15,42,68,0.14); backdrop-filter:blur(6px); }
  .prc-head { display:flex; align-items:center; gap:10px; font-size:14px; color:var(--text-primary); font-weight:600; }
  .prc-head img { width:22px; height:22px; object-fit:contain; }
  .prc-head .prc-live { margin-left:auto; font-family:'Poppins', sans-serif; font-size:11px; color:var(--accent-deep); display:inline-flex; align-items:center; gap:6px; }
  .prc-head .prc-live i { width:6px; height:6px; border-radius:50%; background:var(--accent); }
  .prc-passport { margin:18px 0; background:linear-gradient(135deg, rgba(0,194,203,0.16), rgba(0,194,203,0.04)); border:1px solid var(--accent-border); border-radius:12px; padding:16px; }
  .prc-pp-strip { display:flex; align-items:center; justify-content:space-between; font-family:'Poppins', sans-serif; font-size:11px; letter-spacing:0.12em; color:var(--text-primary); }
  .prc-pp-chip { letter-spacing:0.04em; color:var(--accent-deep); border:1px solid var(--accent-border); border-radius:999px; padding:3px 9px; }
  .prc-pp-rows { display:flex; flex-direction:column; gap:7px; margin-top:14px; }
  .prc-pp-rows span { height:7px; border-radius:4px; background:#FFFFFF; }
  .prc-pp-rows span:nth-child(1) { width:80%; } .prc-pp-rows span:nth-child(2) { width:62%; } .prc-pp-rows span:nth-child(3) { width:71%; }
  .prc-lines { display:flex; flex-direction:column; gap:10px; }
  .prc-line { display:flex; align-items:baseline; justify-content:space-between; font-size:13.5px; }
  .prc-line .k { color:var(--text-secondary); }
  .prc-line .v { font-family:'Poppins', sans-serif; color:var(--text-primary); font-weight:500; }
  .prc-line .v.accent { color:var(--accent-deep); }
  .prc-total { display:flex; align-items:center; justify-content:space-between; margin-top:16px; padding-top:16px; border-top:1px solid var(--border); color:var(--text-secondary); font-size:13.5px; }
  .prc-total b { font-family:'Poppins', sans-serif; font-size:26px; font-weight:700; color:var(--text-primary); }
  @media (max-width: 900px) { .pr-hero-grid { grid-template-columns:1fr; gap:40px; } .pr-hero-card { max-width:100%; } }

  /* ---- pricing tiers ---- */
  .pr-plans { display:grid; grid-template-columns:repeat(4, 1fr); gap:18px; align-items:stretch; }
  .pr-plan { display:flex; flex-direction:column; background:#fff; border:1px solid var(--border); border-top:4px solid var(--metal, var(--border-strong)); border-radius:16px; padding:26px 22px; box-shadow:var(--shadow-sm); position:relative; transition:transform 180ms ease, box-shadow 180ms ease; }
  .pr-plan:hover { transform:translateY(-3px); box-shadow:0 16px 34px rgba(15,42,68,0.03); }
  .pr-plan[data-tier="starter"] { --metal:#9AA3AC; }
  .pr-plan[data-tier="silver"] { --metal:#8C97A8; }
  .pr-plan[data-tier="gold"] { --metal:var(--accent); }
  .pr-plan[data-tier="platinum"] { --metal:#0F2A44; }
  .pr-plan.featured { border-color:var(--accent-border); box-shadow:0 14px 40px rgba(0,194,203,0.18); }
  .pr-badge { position:absolute; top:-12px; left:50%; transform:translateX(-50%); background:var(--accent); color:var(--text-primary); font-family:'Poppins', sans-serif; font-size:11px; font-weight:600; letter-spacing:0.04em; padding:5px 13px; border-radius:999px; white-space:nowrap; }
  .pr-eyebrow { font-family:'Poppins', sans-serif; font-size:11px; font-weight:500; letter-spacing:0.1em; text-transform:uppercase; color:var(--metal); }
  .pr-plan[data-tier="gold"] .pr-eyebrow { color:var(--accent-deep); }
  .pr-plan h3 { font-size:24px; font-weight:700; letter-spacing:-0.02em; margin-top:6px; color:var(--text-primary); }
  .pr-band { font-size:13.5px; color:var(--text-secondary); margin-top:4px; }
  .pr-band strong { color:var(--text-primary); }
  .pr-price { display:flex; align-items:baseline; gap:6px; margin:18px 0 2px; min-height:3rem; }
  .pr-price .amt { font-family:'Poppins', sans-serif; font-size:40px; font-weight:700; letter-spacing:-0.02em; color:var(--text-primary); }
  .pr-price .per { font-size:14px; color:var(--text-muted); }
  .pr-note { font-size:13px; line-height:1.5; color:var(--text-secondary); min-height:2.6em; }
  .pr-plan .btn { width:100%; justify-content:center; margin:16px 0 18px; }
  .pr-grp { margin-bottom:14px; }
  .pr-grp h4 { font-family:'Poppins', sans-serif; font-size:11.5px; font-weight:500; letter-spacing:0.06em; text-transform:uppercase; color:var(--text-muted); margin-bottom:10px; }
  .pr-grp ul { list-style:none; display:flex; flex-direction:column; gap:7px; }
  .pr-grp li { display:flex; gap:9px; align-items:flex-start; font-size:13.5px; line-height:1.45; color:var(--text-secondary); }
  .pr-grp li svg { flex:none; width:15px; height:15px; margin-top:2px; color:var(--accent-deep); }
  .pr-foot { margin-top:auto; padding-top:14px; border-top:1px dashed var(--border); font-family:'Poppins', sans-serif; font-size:12px; color:var(--text-muted); }

  /* ---- extensions (dark) ---- */
  .pr-addon .ext-grid { display:grid; grid-template-columns:repeat(3, 1fr); gap:14px; margin-top:8px; }
  .pr-ext { background:#FFFFFF; border:1px solid var(--border); border-radius:14px; padding:18px 16px; }
  .pr-ext .ext-price { font-family:'Poppins', sans-serif; font-size:20px; font-weight:700; color:var(--text-primary); }
  .pr-ext .ext-unit { font-family:'Poppins', sans-serif; font-size:12px; color:var(--text-secondary); }
  .pr-ext .ext-name { font-weight:600; font-size:15px; color:var(--text-primary); margin-top:8px; }
  .pr-ext .ext-desc { font-size:13px; line-height:1.5; color:var(--text-secondary); margin-top:5px; }
  .pr-ext.free { border-color:var(--accent-border); background:rgba(0,194,203,0.10); }
  .pr-ext .free-pill { display:inline-block; font-family:'Poppins', sans-serif; font-size:11px; font-weight:600; background:var(--accent); color:var(--text-primary); border-radius:6px; padding:2px 8px; margin-left:8px; vertical-align:middle; }
  .pr-fine { font-size:13.5px; line-height:1.6; color:var(--text-secondary); margin-top:20px; }
  .pr-fine strong { color:var(--text-primary); }

  /* ---- comparison table ---- */
  .pr-table-scroll { overflow-x:auto; border:1px solid var(--border); border-radius:16px; background:#fff; }
  .pr-table { width:100%; border-collapse:collapse; min-width:820px; font-size:14px; }
  .pr-table thead th { padding:16px 14px; text-align:center; font-size:15px; font-weight:700; letter-spacing:-0.01em; color:var(--text-primary); border-bottom:1px solid var(--border-strong); background:var(--bg-secondary); }
  .pr-table thead th:first-child { text-align:left; }
  .pr-table thead th .dot { display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:7px; vertical-align:1px; }
  .pr-table tbody th[scope="row"] { text-align:left; font-weight:500; color:var(--text-secondary); padding:11px 14px; }
  .pr-table tbody td { text-align:center; padding:11px 14px; color:var(--text-secondary); }
  .pr-table tbody tr { border-bottom:1px solid var(--border); }
  .pr-table tr.pr-sec th { background:var(--accent-tint); font-family:'Poppins', sans-serif; font-weight:500; font-size:12.5px; letter-spacing:0.04em; text-transform:uppercase; color:var(--accent-deep); padding:12px 14px; }
  .pr-table td .dash { color:var(--text-muted); }
  .pr-table td svg { width:15px; height:15px; color:var(--accent-deep); vertical-align:middle; }

  /* ---- FAQ ---- */
  .pr-faq-list { max-width:780px; margin:0 auto; display:flex; flex-direction:column; gap:12px; }
  .pr-faq { border:1px solid var(--border); border-radius:14px; background:#fff; overflow:hidden; transition:border-color 160ms ease; }
  .pr-faq[open] { border-color:var(--accent-border); }
  .pr-faq summary { cursor:pointer; list-style:none; padding:18px 22px; font-weight:600; font-size:16px; color:var(--text-primary); display:flex; justify-content:space-between; align-items:center; gap:16px; }
  .pr-faq summary::-webkit-details-marker { display:none; }
  .pr-faq summary .plus { flex:none; width:20px; height:20px; color:var(--accent-deep); transition:transform 200ms ease; }
  .pr-faq[open] summary .plus { transform:rotate(45deg); }
  .pr-faq .pr-faq-body { padding:0 22px 20px; color:var(--text-secondary); font-size:14.5px; line-height:1.6; }

  @media (max-width: 1020px) { .pr-plans { grid-template-columns:repeat(2, 1fr); } .pr-addon .ext-grid { grid-template-columns:repeat(2, 1fr); } }
  @media (max-width: 620px) { .pr-plans { grid-template-columns:1fr; } .pr-addon .ext-grid { grid-template-columns:1fr; } }

  /* ---- talk-to-a-human modal ---- */
  .tk-overlay { position:fixed; inset:0; z-index:200; display:none; align-items:center; justify-content:center; padding:24px; background:rgba(15,42,68,0.31); backdrop-filter:blur(4px); }
  .tk-overlay.open { display:flex; }
  .tk-modal { width:100%; max-width:480px; max-height:92vh; overflow-y:auto; background:#fff; border:1px solid var(--border); border-radius:18px; box-shadow:0 40px 90px rgba(15,42,68,0.12); padding:30px; animation:tkPop 240ms cubic-bezier(.2,.7,.2,1) both; }
  @keyframes tkPop { from { opacity:0; transform:translateY(14px) scale(.98); } to { opacity:1; transform:none; } }
  .tk-close { float:right; width:34px; height:34px; border-radius:8px; border:1px solid var(--border); background:#fff; color:var(--text-secondary); cursor:pointer; display:grid; place-items:center; }
  .tk-close:hover { background:var(--bg-secondary); color:var(--text-primary); }
  .tk-close svg { width:16px; height:16px; }
  .tk-modal .tk-eyebrow { font-family:'Poppins', sans-serif; font-size:12px; color:var(--accent-deep); }
  .tk-modal h3 { font-size:22px; font-weight:700; letter-spacing:-0.02em; color:var(--text-primary); margin:8px 0 6px; }
  .tk-modal .tk-lede { font-size:14px; line-height:1.55; color:var(--text-secondary); margin-bottom:20px; }
  .tk-field { margin-bottom:14px; }
  .tk-field label { display:block; font-size:13px; font-weight:600; color:var(--text-primary); margin-bottom:6px; }
  .tk-field label .req { color:var(--accent-deep); }
  .tk-field input, .tk-field select { width:100%; background:var(--bg-secondary); border:1px solid var(--border); border-radius:8px; padding:11px 13px; font-family:inherit; font-size:14.5px; color:var(--text-primary); outline:none; transition:border-color 150ms ease, background 150ms ease; }
  .tk-field input:focus, .tk-field select:focus { border-color:var(--accent); background:#fff; }
  .tk-field.bad input, .tk-field.bad select { border-color:#dc2626; background:#fef2f2; }
  .tk-field .err { display:none; font-size:12px; color:#dc2626; margin-top:5px; font-weight:500; }
  .tk-field.bad .err { display:block; }
  .tk-row2 { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .tk-pref { display:flex; gap:8px; }
  .tk-pref label { flex:1; display:flex; align-items:center; gap:8px; font-size:13.5px; font-weight:500; color:var(--text-secondary); background:var(--bg-secondary); border:1px solid var(--border); border-radius:8px; padding:10px 12px; cursor:pointer; }
  .tk-pref label:has(input:checked) { border-color:var(--accent); color:var(--text-primary); background:var(--accent-tint); }
  .tk-pref input { accent-color:var(--accent); }
  .tk-modal .btn { width:100%; justify-content:center; margin-top:6px; }
  .tk-fine { font-size:12px; color:var(--text-muted); text-align:center; margin-top:12px; }
  .tk-done { text-align:center; padding:12px 4px; }
  .tk-done .ck { width:56px; height:56px; border-radius:50%; background:var(--accent); color:var(--text-primary); display:grid; place-items:center; margin:0 auto 18px; }
  .tk-done .ck svg { width:28px; height:28px; }
  .tk-done h3 { font-size:21px; font-weight:700; color:var(--text-primary); }
  .tk-done p { font-size:14.5px; line-height:1.6; color:var(--text-secondary); margin-top:10px; }
  @media (max-width: 460px) { .tk-row2 { grid-template-columns:1fr; } .tk-pref { flex-direction:column; } }
</style>
</head>
